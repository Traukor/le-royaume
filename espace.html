<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace membre — Le Royaume</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="brand" href="index.html"><img src="img/logo.webp" alt=""><span>Le Royaume</span></a>
    <a href="index.html">Accueil</a>
    <a href="charte.html">Charte</a>
    <a href="index.html#rejoindre">Nous rejoindre</a>
    <a href="espace.html" aria-current="page">Espace membre</a>
  </nav>

  <main class="espace">
    <h1>Espace membre</h1>
    <div id="etat" aria-live="polite"><p>Chargement…</p></div>
    <div id="contenu"></div>
    <dialog id="zoom" class="zoom" closedby="none"></dialog>
  </main>

  <footer>Le Royaume — guilde francophone sur World of Warcraft Forever.<br>World of Warcraft est une marque de Blizzard Entertainment.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script>
    // Adresse et clé publique du projet Supabase (publiques par conception : la sécurité repose
    // sur la vérification côté serveur et les règles d'accès de la base, pas sur ces valeurs).
    const SUPABASE_URL = 'https://gobvfbwuesskhrgcrzjd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BJwMSdlBLfltRGA-GCELrQ_MbyCM1x_';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const etat = document.getElementById('etat');
    const contenu = document.getElementById('contenu');
    let vue = 'membre'; // interface affichée : tout le monde arrive sur l'interface membre
    let officier = false; // vue === 'officier'
    let droits = {}; // rôles Discord vérifiés : autorise (officier), gestion (gestion du site)

    // crée un élément ; les textes passent par textContent (pas d'injection possible)
    const el = (tag, { dataset, ...props } = {}, ...enfants) => {
      const e = Object.assign(document.createElement(tag), props);
      Object.assign(e.dataset, dataset); // dataset est en lecture seule : on remplit l'existant
      e.append(...enfants.filter(x => x != null && x !== false));
      return e;
    };
    // remplace le contenu de la zone d'état
    const afficher = (texte, bouton) => etat.replaceChildren(el('p', { textContent: texte }), ...(bouton ? [bouton] : []));
    const bouton = (texte, classe, action) => el('button', { className: 'btn ' + classe, textContent: texte, onclick: action });
    const connexion = () => sb.auth.signInWithOAuth({
      provider: 'discord',
      options: { scopes: 'identify', redirectTo: location.origin + location.pathname },
    });
    const deconnexion = () => sb.auth.signOut(); // l'événement SIGNED_OUT relance verifier()
    const quand = d => new Date(d).toLocaleString('fr-FR', { timeZone: 'Europe/Paris',
      weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

    async function verifier() {
      contenu.replaceChildren();
      if (zoom.open) zoom.close(); // pas de fenêtre d'officier laissée ouverte après déconnexion
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return afficher('Cet espace est réservé aux membres de la guilde. Connectez-vous avec votre compte Discord.',
        bouton('Se connecter avec Discord', 'discord', connexion));

      afficher('Vérification de votre rôle sur le Discord de la guilde…');
      const { data, error } = await sb.functions.invoke('verifier-role');
      if (error) return afficher('La vérification a échoué. Réessayez plus tard.', bouton('Se déconnecter', '', deconnexion));
      if (!data.membre && !data.serveur) return afficher("Ce compte Discord n'est pas sur le serveur de la guilde.", bouton('Se déconnecter', '', deconnexion));
      vue = 'membre'; officier = false;
      droits = data;
      moi = session.user.user_metadata.provider_id ?? session.user.user_metadata.sub;
      chargerCharte();
      // invité (sur le Discord sans rôle de la guilde) : la charte seulement, à lire et signer
      if (!data.membre) {
        afficher(`Bienvenue ${data.pseudo}. Votre compte n'a pas encore de rôle de la guilde : vous pouvez lire et signer la charte.`, bouton('Se déconnecter', '', deconnexion));
        return contenu.replaceChildren(blocCharte);
      }
      chargerAbsences();
      afficher(`Bienvenue ${data.pseudo}${data.gestion ? ', accès gestion du site confirmé' : data.autorise ? ', accès officier confirmé' : ''}.`, bouton('Se déconnecter', '', deconnexion));

      calendrier(); // tout de suite depuis la base ; redessiné si la synchronisation apporte du nouveau
      const synchro = await sb.functions.invoke('synchro-raidhelper');
      // le message du serveur (ex. « Raid-Helper a répondu 401 ») aide à comprendre une panne
      const detail = synchro.error && await synchro.error.context?.json?.().then(d => d.erreur, () => null);
      if (synchro.error) calendrier(`Synchronisation Raid-Helper impossible${detail ? ' (' + detail + ')' : ''} : les sorties affichées peuvent dater un peu.`);
      else if (synchro.data?.synchro) calendrier();
    }

    // Calendrier mensuel (semaines du lundi au dimanche, heure de Paris)
    const jourParis = d => new Date(d).toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }); // AAAA-MM-JJ
    const heure = d => new Date(d).toLocaleTimeString('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' });
    let mois = new Date(jourParis(Date.now()).slice(0, 7) + '-01T12:00'); // midi : à l'abri des changements d'heure
    let avertissementSynchro = null, demandeCal = 0;

    async function calendrier(avertissement = avertissementSynchro) {
      avertissementSynchro = avertissement;
      const n = ++demandeCal; // mois changés vite : seule la dernière réponse s'affiche
      const debut = new Date(mois); debut.setDate(1 - (mois.getDay() + 6) % 7); // lundi de la 1re semaine
      const jours = Array.from({ length: 42 }, (_, i) => { const d = new Date(debut); d.setDate(debut.getDate() + i); return d; });
      const { data, error } = await sb.from('sorties').select('id, titre, debut, inscriptions(count)')
        .gte('debut', new Date(debut.getTime() - 86400e3).toISOString())
        .lt('debut', new Date(jours[41].getTime() + 86400e3).toISOString()).order('debut')
        .or('classe.is.null,classe.neq.Absence', { referencedTable: 'inscriptions' }); // inscrits hors « Absence »
      if (n !== demandeCal || vue === 'gestion') return; // la synchronisation ne remplace pas les statistiques
      if (error) return contenu.replaceChildren(interfaces(), el('p', { textContent: 'Calendrier indisponible pour le moment.' }));

      const parJour = Map.groupBy(data, s => jourParis(s.debut));
      const aujourdhui = jourParis(Date.now());
      const changer = n => () => { mois.setMonth(mois.getMonth() + n); calendrier(); };
      const cases = jours.map(d => {
        const cle = jourParis(d);
        return el('div', { className: 'jour' + (d.getMonth() !== mois.getMonth() ? ' autre' : '') + (cle === aujourdhui ? ' auj' : '') },
          el('span', { className: 'num', textContent: d.getDate() }),
          ...(parJour.get(cle) ?? []).map(s => el('button', { className: 'ev', title: s.titre || 'Sortie', onclick: () => sortie(s.id) },
            el('time', { textContent: heure(s.debut) }), el('span', { textContent: ' ' + (s.titre || 'Sortie') }),
            el('small', { textContent: ` · ${s.inscriptions[0].count}` }))));
      });
      contenu.replaceChildren(
        ...(avertissement ? [el('p', { className: 'vide', textContent: avertissement })] : []),
        interfaces(),
        el('p', { className: 'outils' }, !officier && bouton('Mon suivi', '', suivi),
          bouton(officier ? 'Loots' : 'Mes loots', '', historique),
          officier && bouton('Stats joueurs', '', statsJoueurs), officier && bouton('Actualiser', '', actualiser)),
        el('div', { className: 'cal-tete' },
          el('button', { className: 'nav-mois', textContent: '‹', ariaLabel: 'Mois précédent', onclick: changer(-1) }),
          el('h2', { textContent: mois.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }) }),
          el('button', { className: 'nav-mois', textContent: '›', ariaLabel: 'Mois suivant', onclick: changer(1) })),
        el('div', { className: 'cal' },
          ...['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'].map(j => el('div', { className: 'jsem', textContent: j })),
          ...cases),
        blocAbsences, blocCharte);
    }

    // choix de l'interface selon les rôles : membre pour tous, officier (appel, loots), gestion du site (statistiques)
    const VUES = { membre: 'Membre', officier: 'Officier', gestion: 'Gestion du site' };
    const interfaces = () => {
      const permises = Object.entries(VUES).filter(([v]) => v === 'membre' || (v === 'officier' ? droits.autorise : droits.gestion));
      return permises.length < 2 ? '' : el('div', { className: 'onglets', role: 'tablist', ariaLabel: 'Interface' }, // rien pour un simple membre
        ...permises.map(([v, t]) => el('button', { type: 'button', role: 'tab', textContent: t, ariaSelected: v === vue, onclick: () => changerVue(v) })));
    };
    const changerVue = v => {
      vue = v; officier = v === 'officier';
      if (v === 'gestion') return gestion();
      chargerAbsences();
      chargerCharte();
      calendrier();
    };

    // Gestion du site : comptes connus de l'espace (la base vérifie le rôle de gestion)
    async function gestion() {
      const { data, error } = await sb.rpc('comptes');
      if (vue !== 'gestion') return;
      const niveau = c => c.gestion ? 'Gestion' : c.officier ? 'Officier' : c.membre ? 'Membre' : c.serveur ? 'Invité (sans rôle)' : 'Hors du Discord';
      contenu.replaceChildren(interfaces(), el('h2', { textContent: 'Comptes connus' }),
        error ? el('p', { textContent: 'Comptes indisponibles : ' + error.message }) : el('div', { className: 'stats' }, el('table', {},
          el('thead', {}, el('tr', {}, ...['Pseudo', 'Accès', 'Dernière ouverture de l’espace'].map(t => el('th', { textContent: t })))),
          el('tbody', {}, ...data.map(c => el('tr', {}, ...[c.pseudo ?? '?', niveau(c), quand(c.maj)].map(v => el('td', { textContent: v }))))))),
        el('p', { className: 'vide', textContent: "Accès relu sur le Discord à chaque ouverture de l'espace." }));
    }

    // synchronisation immédiate, sans attendre le délai de 5 minutes (officiers)
    async function actualiser(e) {
      e.target.disabled = true;
      e.target.textContent = 'Actualisation…';
      const { error } = await sb.functions.invoke('synchro-raidhelper', { body: { forcer: true } });
      calendrier(error ? 'Actualisation impossible pour le moment.' : null);
    }

    // Raid-Helper range les absents, retards, incertains et remplaçants comme des « classes »
    const PREREMPLI = { Absence: 'absent_prevenu', Late: 'retard', Bench: 'banc', Tentative: null };
    const SPECIAUX = { Absence: 'Absents', Late: 'En retard', Tentative: 'Incertains', Bench: 'Remplaçants' };
    const ETATS = { present: 'Présent', retard: 'Retard', absent_prevenu: 'Absent prévenu', absent: 'Absent', banc: 'Banc' };
    // rôle Raid-Helper (« Tanks », « Healers »…) ou, à défaut, classe de rôle (« Tank », « Healer »…)
    const roleDe = i => { const r = `${i.role} ${i.classe}`.toLowerCase();
      return r.includes('tank') ? 'Tanks' : r.includes('heal') ? 'Soigneurs' : /melee|ranged|dps/.test(r) ? 'DPS' : 'Autres'; };
    const CIBLES = { Tanks: 2, Soigneurs: 5, DPS: 13 }; // par défaut ; réglables par sortie (table cibles)
    const COLONNES_CIBLES = { Tanks: 'tanks', Soigneurs: 'soigneurs', DPS: 'dps' };
    const STATUTS = { '': '—', valide: 'Validé', attente: 'En attente' };
    const ONGLETS = { composition: 'Composition', appel: 'Appel', loots: 'Loots' };
    const DESTINATIONS = { joueur: 'Pour un joueur', desenchante: 'Désenchanté', banque: 'Banque' };
    const TYPES = { '+1': '+1 spé principale', '+2': '+2 spé secondaire', '+3': '+3 collection' };
    const pourQui = l => l.destination !== 'joueur' ? DESTINATIONS[l.destination].toLowerCase()
      : `${!l.personnage ? l.nom : l.personnage.startsWith(l.nom) ? l.personnage : l.personnage + ' (' + l.nom + ')'} ${l.type ?? ''}`.trim();

    async function sortie(id, onglet) {
      const rien = { data: [] };
      const [{ data: s }, { data: inscrits }, { data: appel }, { data: compo }, { data: reglage },
             { data: lootsLus }, { data: persos }, { data: stats3m }, { data: journal }] = await Promise.all([
        sb.from('sorties').select('*').eq('id', id).single(),
        sb.from('inscriptions').select('*').eq('sortie_id', id).order('position'),
        officier ? sb.from('appel').select('*').eq('sortie_id', id) : rien,
        sb.from('composition').select('*').eq('sortie_id', id),
        sb.from('cibles').select('*').eq('sortie_id', id).maybeSingle(),
        sb.from('loots').select('*').eq('sortie_id', id).order('le'), // membre : la base ne renvoie le butin que s'il était en raid
        officier ? sb.from('personnages').select('*').order('proprietaire').order('nom') : rien,
        officier ? sb.rpc('stats_joueurs', { depuis: debutDe('3m') + 'T00:00:00' }) : rien,
        officier ? sb.from('appel_journal').select('*').eq('sortie_id', id).order('modifie_le', { ascending: false }) : rien,
      ]);
      if (!s) return;
      const loots = lootsLus ?? [];
      const jour = jourParis(s.debut);
      const { data: absents } = await sb.rpc('absents', { jour }); // absences déclarées couvrant la soirée
      const entete = [fermer(), el('h2',{ textContent: s.titre || 'Sortie' }),
        el('p', { textContent: quand(s.debut) + (s.chef ? ' — menée par ' + s.chef : '') })];
      const detail = i => [i.spe, i.classe].filter(Boolean).join(' ');
      const statut = new Map((compo ?? []).map(c => [c.joueur, c.statut]));
      const absent = new Set(absents ?? []);

      // Composition : inscrits par rôle, avec la cible ; les officiers valident ou mettent en attente
      const message = el('p', { className: 'vide' });
      const choisir = i => el('select', { className: 'statut', ariaLabel: 'Statut de ' + i.nom, onchange: async e => {
        const v = e.target.value;
        const { error } = v ? await sb.from('composition').upsert({ sortie_id: id, joueur: i.discord_id, statut: v })
          : await sb.from('composition').delete().eq('sortie_id', id).eq('joueur', i.discord_id);
        if (error) return message.textContent = "L'enregistrement a échoué : " + error.message;
        sortie(id, 'composition'); // compteurs à jour
      } }, ...Object.entries(STATUTS).map(([v, t]) => el('option', { value: v, textContent: t, selected: v === (statut.get(i.discord_id) ?? '') })));
      // une absence déclarée range l'inscrit parmi les absents, quel que soit son bouton Raid-Helper
      const groupes = Map.groupBy(inscrits, i => absent.has(i.discord_id) ? SPECIAUX.Absence : SPECIAUX[i.classe] ?? roleDe(i));
      const cible = g => reglage?.[COLONNES_CIBLES[g]] ?? CIBLES[g];
      const regler = g => el('input', { type: 'number', min: 0, value: cible(g), className: 'cible', ariaLabel: 'Cible ' + g,
        onchange: async e => {
          const valeurs = Object.fromEntries(Object.keys(CIBLES).map(k => [COLONNES_CIBLES[k], cible(k)]));
          const { error } = await sb.from('cibles').upsert({ sortie_id: id, ...valeurs, [COLONNES_CIBLES[g]]: +e.target.value });
          if (error) return message.textContent = "L'enregistrement a échoué : " + error.message;
          sortie(id, 'composition');
        } });
      const ordre = ['Tanks', 'Soigneurs', 'DPS', 'Autres', ...Object.values(SPECIAUX)];
      const composition = el('div', { className: 'compo' }, ...ordre.filter(g => groupes.has(g) || CIBLES[g]).map(g => {
        const liste = groupes.get(g) ?? [];
        const valides = liste.filter(i => statut.get(i.discord_id) === 'valide').length;
        return el('section', {},
          el('h3', {}, g + (CIBLES[g] ? ` ${liste.length} / ` : ` (${liste.length})`),
            CIBLES[g] && (officier ? regler(g) : String(cible(g))),
            valides ? ` · ${valides} validé${valides > 1 ? 's' : ''}` : ''),
          el('ul', { className: 'inscrits' }, ...liste.map(i => el('li', {},
            el('strong', { textContent: i.nom }), el('span', { textContent: ' ' + detail(i) }),
            absent.has(i.discord_id) && el('em', { textContent: ' absence déclarée' }),
            officier ? choisir(i) : statut.has(i.discord_id) && el('em', { textContent: ' ' + STATUTS[statut.get(i.discord_id)].toLowerCase() })))));
      }));
      const butin = l => el('li', {}, el('strong', { textContent: l.objet }), l.boss && el('span', { textContent: ' — ' + l.boss }), ' → ' + pourQui(l));
      if (!officier) return ouvrir(...entete, composition,
        loots.length > 0 && el('h3', { textContent: 'Butin' }), loots.length > 0 && el('ul', { className: 'inscrits' }, ...loots.map(butin)));

      // Appel : celui déjà saisi, sinon pré-rempli (inscription Raid-Helper, absence déclarée, liste d'attente)
      const saisi = new Map(appel.map(a => [a.joueur, a]));
      // fenêtre reconstruite (statut, cible, loot) pendant une saisie : les lignes non enregistrées sont reprises
      const reprise = brouillon?.id === id ? brouillon.lignes : null;
      const modifie = () => brouillon = { id, lignes };
      const lignes = reprise ?? el('div', { className: 'appel', onchange: modifie });
      // les non-inscrits Raid-Helper peuvent être retirés (effectif à l'enregistrement)
      const ligne = (joueur, nom, info, etatInitial, minutes, retirable) => lignes.append(
        el('fieldset', { className: 'ligne', dataset: { joueur, nom } },
          el('legend', {}, el('strong', { textContent: nom }), info && el('span', { textContent: ' ' + info }),
            retirable && el('button', { className: 'retirer', type: 'button', textContent: '×', title: "Retirer de l'appel",
              ariaLabel: 'Retirer ' + nom + " de l'appel", onclick: e => { e.target.closest('.ligne').remove(); modifie(); } })),
          ...Object.entries(ETATS).map(([v, t]) => el('label', {},
            el('input', { type: 'radio', name: 'e' + joueur, value: v, checked: v === etatInitial }), ' ' + t)),
          el('label', { className: 'min' }, el('input', { type: 'number', min: 0, value: minutes ?? '', placeholder: '?' }), ' min')));
      // absence déclarée : pré-rempli « absent prévenu », corrigeable si le joueur vient quand même ;
      // un appel déjà enregistré l'emporte (une absence déclarée après coup ne l'écrase pas)
      if (!reprise) {
        for (const i of inscrits) {
          const a = saisi.get(i.discord_id), att = statut.get(i.discord_id) === 'attente', abs = absent.has(i.discord_id);
          const prevu = abs ? 'absent_prevenu' : i.classe in PREREMPLI ? PREREMPLI[i.classe] : att ? 'banc' : 'present';
          ligne(i.discord_id, i.nom, [detail(i), att && 'en attente', abs && 'absence déclarée'].filter(Boolean).join(' · '),
            a ? a.etat : prevu, a?.retard_min);
        }
        for (const a of appel) if (!inscrits.some(i => i.discord_id === a.joueur)) ligne(a.joueur, a.nom, 'non inscrit', a.etat, a.retard_min, true);
      }

      const nouveau = el('input', { type: 'text', placeholder: 'Joueur non inscrit' });
      const ajouter = bouton('Ajouter', '', () => {
        const nom = nouveau.value.trim(), joueur = 'nom:' + nom.toLowerCase();
        // un même joueur deux fois ferait échouer tout l'enregistrement
        if (nom && ![...lignes.querySelectorAll('.ligne')].some(f => f.dataset.joueur === joueur)) {
          ligne(joueur, nom, 'non inscrit', 'present', null, true);
          modifie();
        }
        nouveau.value = '';
      });
      const dernier = appel.reduce((a, b) => (a && a.modifie_le > b.modifie_le ? a : b), null);
      const etatAppel = el('p', { className: 'vide', textContent: reprise ? 'Appel modifié, pas encore enregistré.' : dernier
        ?`Appel enregistré, dernière modification par ${dernier.modifie_par} le ${quand(dernier.modifie_le)}.`
        : "Appel pas encore fait : pré-rempli avec les inscriptions Raid-Helper et la liste d'attente." });

      const enregistrer = bouton("Enregistrer l'appel", 'discord', async () => {
        const fiches = [...lignes.querySelectorAll('.ligne')];
        // une ligne sans état (ex. « Tentative ») serait perdue sans bruit : on la fait choisir d'abord
        const sansEtat = fiches.filter(f => !f.querySelector('input[type=radio]:checked')).map(f => f.dataset.nom);
        if (sansEtat.length) return etatAppel.textContent = 'Choisissez un état pour : ' + sansEtat.join(', ') + '.';
        const rangs = fiches.map(f => {
          const e = f.querySelector('input[type=radio]:checked').value;
          const min = f.querySelector('input[type=number]').value;
          return { sortie_id: id, joueur: f.dataset.joueur, nom: f.dataset.nom, etat: e,
            retard_min: e === 'retard' && min !== '' ? +min : null };
        })
          // seules les lignes nouvelles ou modifiées partent (et sont donc journalisées)
          .filter(r => { const a = saisi.get(r.joueur); return !a || a.etat !== r.etat || a.retard_min !== r.retard_min; });
        const presents = new Set(fiches.map(f => f.dataset.joueur));
        const retires = [...saisi.keys()].filter(j => !presents.has(j));
        if (!rangs.length && !retires.length) return etatAppel.textContent = 'Aucune modification.';
        const { error } = rangs.length ? await sb.from('appel').upsert(rangs) : {};
        const { error: e2 } = retires.length ? await sb.from('appel').delete().eq('sortie_id', id).in('joueur', retires) : {};
        if (error || e2) return etatAppel.textContent = "L'enregistrement a échoué : " + (error || e2).message;
        brouillon = null;
        sortie(id, 'appel');
      });

      // Historique des corrections (journal tenu par la base) : qui, quand, quel état
      const noms = new Map([...inscrits.map(i => [i.discord_id, i.nom]), ...appel.map(a => [a.joueur, a.nom])]);
      const historiqueAppel = journal.length > 0 && el('details', { className: 'journal' },

    // Historique des loots, filtrable (interface officier : tous ; interface membre : les siens)

    // Suivi d'un joueur : taux de présence et de retard, soirées appelées (règle « mes lignes » sur appel).
    // « Mon suivi » pour soi ; fiche d'un joueur depuis Stats joueurs (officiers), avec ses loots et, pour un
    // joueur ajouté à la main, le rattachement à son compte Discord
    async function suivi(joueur = moi, nom, retour) {
      if (typeof joueur !== 'string') joueur = moi; // appelé par le bouton « Mon suivi » (événement)
      const fiche = joueur !== moi;
      const haut = [fermer(), retour && el('button', { className: 'lien', type: 'button', textContent: '‹ Retour aux stats', onclick: retour }),
        el('h2', { textContent: fiche ? nom : 'Mon suivi' })];
      const taux = depuis => sb.rpc('stats_joueurs', { depuis }).eq('joueur', joueur).maybeSingle();
      const [{ data: trois }, { data: tout }, { data: soirees, error }, { data: loots }, { data: inscr }] = await Promise.all([
        taux(new Date(debutDe('3m') + 'T00:00').toISOString()), taux(null),

      soirees.sort((a, b) => b.sorties.debut.localeCompare(a.sorties.debut));

      // joueur ajouté à la main lors de l'appel : son appel et ses loots passent sur le compte Discord choisi

        el('p', {}, choix, ' ', bouton('Rattacher', '', async () => {
          if (!choix.value) return message.textContent = 'Choisissez le joueur.';
          const cible = connus.get(choix.value);
          if (!confirm(`Rattacher ${nom} à ${cible} ? Cette opération est définitive.`)) return;
          const { error } = await sb.rpc('rattacher', { ancien: joueur, nouveau: choix.value });
          if (error) return message.textContent = 'Le rattachement a échoué : ' + error.message;
          compares = compares.map(c => c.joueur === joueur ? { joueur: choix.value, nom: cible } : c);
          suivi(choix.value, cible, retour);
        })), message);

      ouvrir(...haut, rattacher,

          periode('3 derniers mois', trois), periode('Depuis le début', tout)),
        el('h3', { textContent: fiche ? 'Soirées' : 'Mes soirées' }),
        soirees.length ? tableau(['Date', 'Sortie', 'Appel'], ...soirees.map(a => el('tr', {}, ...[quand(a.sorties.debut), a.sorties.titre || 'Sortie',

          ...[new Date(l.le).toLocaleDateString('fr-FR', { timeZone: 'Europe/Paris' }), l.objet, l.boss, pourQui(l), l.sorties?.titre]
            .map(v => el('td', { textContent: v ?? '–' })))))

    // Charte : chaque membre approuve la version en cours ; l'interface officier liste qui ne l'a pas fait
    const CHARTE = '2026-10-05'; // date de la dernière modification du texte de charte.html : la changer redemande la signature

    async function chargerCharte() {

        const retirer = g => async () => {

            el('button', { className: 'retirer', type: 'button', textContent: '×', title: 'Retirer la signature', ariaLabel: 'Retirer la signature de ' + g.nom, onclick: retirer(g) })))),
          message,

          el('p', { className: 'vide', textContent: "Seuls les membres déjà connectés à l'espace sont connus du site." }));
      }
      const { data, error } = await sb.from('signatures').select('le').eq('joueur', moi).eq('version', CHARTE).maybeSingle();
      if (error) return blocCharte.replaceChildren(titre, el('p', { textContent: 'Charte indisponible pour le moment.' }));
      const message = el('p', { className: 'vide' });
      blocCharte.replaceChildren(titre, data
        ? el('p', {}, `Vous avez approuvé la charte le ${new Date(data.le).toLocaleDateString('fr-FR', { timeZone: 'Europe/Paris' })}. `, lien)
        : el('p', {}, "Merci de lire la charte de la guilde puis de l'approuver. ", lien, ' ',
            bouton("J'ai lu et j'approuve", 'discord', async () => {
              const { error } = await sb.from('signatures').insert({ version: CHARTE });
              if (error) return message.textContent = "L'enregistrement a échoué : " + error.message;
              chargerCharte();
            })), message);

    // Absences longues : chacun déclare les siennes ; l'interface officier montre celles de tous
    const blocAbsences = el('section', { className: 'absences' });
    let moi = null; // identifiant Discord du compte connecté

    async function chargerAbsences() {
      let requete = sb.from('absences').select('*').gte('au', jourParis(Date.now()));
      if (!officier) requete = requete.eq('joueur', moi);
      const { data, error } = await requete.order('du');
      if (error) return blocAbsences.replaceChildren(el('p', { textContent: 'Absences indisponibles pour le moment.' }));
      const date = d => new Date(d + 'T12:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
      const du = el('input', { type: 'date', min: jourParis(Date.now()), ariaLabel: 'Du' });

      const declarer = bouton('Déclarer', '', async () => {

      const supprimer = a => async () => {

          a.joueur === moi && el('button', { className: 'retirer', type: 'button', textContent: '×', title: 'Supprimer',
            ariaLabel: 'Supprimer cette absence', onclick: supprimer(a) }))))
          : el('p', { textContent: 'Aucune absence à venir.' }));

    // Statistiques d'appel : tableau de tous les joueurs (triable, export CSV) et comparaison côte à côte
    const PERIODES = { '3s': '3 semaines', '3m': '3 mois', date: 'une date à choisir' };
    const debutDe = (choix, date) => { // AAAA-MM-JJ
      const d = new Date();
      if (choix === '3s') d.setDate(d.getDate() - 21); else if (choix === '3m') d.setMonth(d.getMonth() - 3); else return date;
      return jourParis(d);
    };
    const COLONNES = [['nom', 'Joueur'], ['toutes', 'Soirées'], ['dispo', 'Dispo'], ['presents', 'En raid'], ['presence', 'En raid %'],
      ['bancs', 'Mis au banc'], ['retard', 'Retard %'], ['retard_moyen', 'Retard moyen (min)'], ['absents_prevenus', 'Absent prévenu'], ['absents', 'Absent'],
      ['inscrits', 'Inscrit'], ['inscrits_valides', 'Inscrit et validé'], ['inscrits_presents', 'Inscrit et en raid'], ['inscrits_bancs', 'Inscrit et mis au banc'],
      ['loots', 'Loots'], ['loots_soiree', 'Loots / soirée en raid'], ['dernier', 'Dernier loot']];

    // colonnes de présence : Soirées (toutes les soirées appelées), Dispo (Présent, Retard ou Banc), En raid (Présent ou Retard,
    // taux sur Dispo), Mis au banc ; stats_joueurs compte ses « soirees » hors banc
    const completer = r => ({ ...r, toutes: (r.soirees ?? 0) + (r.bancs ?? 0), dispo: (r.presents ?? 0) + (r.bancs ?? 0),
      presents_seuls: r.presents - r.retards });
    const depuisIso = d => d ? new Date(d + 'T00:00').toISOString() : null;
    // sélecteur « Depuis le » ; debut() donne AAAA-MM-JJ, '' (date effacée) = depuis le début. Créé une fois :
    // recréé à chaque date valide, le champ de date perdrait la saisie en cours
    const choixPeriode = (rappel, initial = '3s') => {
      const liste = el('select', { ariaLabel: 'Période' },
        ...Object.entries(PERIODES).map(([v, t]) => el('option', { value: v, textContent: t, selected: v === initial })));
      const champ = el('input', { type: 'date', max: jourParis(Date.now()), ariaLabel: 'Date de début', hidden: true });
      let affiche;
      liste.onchange = () => {
        champ.hidden = liste.value !== 'date';
        if (!champ.value) champ.value = affiche; // pré-rempli avec le début affiché
        rappel();
      };
      champ.onchange = rappel;
      return { noeud: el('p', { className: 'periode' }, 'Depuis le ', liste, ' ', champ), debut: () => affiche = debutDe(liste.value, champ.value) };
    };

    // tableau de tous les joueurs ; seul le résultat est recalculé
    function stats(zone) {
      let tri = 'bancs', sens = -1, debut, demande = 0;
      const periode = choixPeriode(() => charger());
      const resultat = el('div');

      async function charger() {
        debut = periode.debut();
        const n = ++demande;
        const { data, error } = await sb.rpc('stats_joueurs', { depuis: depuisIso(debut) });
        if (n !== demande) return; // une réponse plus récente est attendue (date tapée chiffre par chiffre)
        if (error) return resultat.replaceChildren(el('p', { textContent: 'Statistiques indisponibles : ' + error.message }));
        const lignes = data.map(completer).map(r => ({ ...r,
          presence: pourcent(r.presents, r.dispo),
          retard: r.presents ? Math.round(100 * r.retards / r.presents) : null,
          loots_soiree: r.presents ? Math.round(100 * r.loots / r.presents) / 100 : null,
          dernier: r.dernier_loot && `${r.dernier_loot} (${new Date(r.dernier_loot_le).toLocaleDateString('fr-FR', { timeZone: 'Europe/Paris' })})` }));
        const comparer = (a, b) => typeof a === 'string' ? a.localeCompare(b, 'fr') : a - b;
        lignes.sort((a, b) => a[tri] == null ? 1 : b[tri] == null ? -1 : sens * comparer(a[tri], b[tri])); // vides en dernier

        const exporter = () => {
          const cellule = v => `"${String(v ?? '').replaceAll('"', '""')}"`;
          const texte = [COLONNES.map(c => c[1]), ...lignes.map(r => COLONNES.map(([k]) => r[k]))]
            .map(l => l.map(cellule).join(';')).join('\r\n'); // « ; » et BOM : ouverture directe dans Excel en français
          el('a', { href: URL.createObjectURL(new Blob(['\ufeff' + texte], { type: 'text/csv' })),
            download: `statistiques-${debut ? 'depuis-' + debut : 'depuis-le-debut'}.csv` }).click();
        };
        const trier = k => () => { sens = k === tri ? -sens : k === 'nom' ? 1 : -1; tri = k; charger(); };
        resultat.replaceChildren(...(lignes.length ? [
          el('div', { className: 'stats' }, el('table', {},
            el('thead', {}, el('tr', {}, ...COLONNES.map(([k, t]) => el('th', {}, el('button', {
              textContent: t + (k === tri ? (sens > 0 ? ' ▲' : ' ▼') : ''), onclick: trier(k) }))))),
            el('tbody', {}, ...lignes.map(r => el('tr', {}, ...COLONNES.map(([k]) => el('td', { textContent: r[k] ?? '–' }))))))),
          bouton('Exporter en CSV', '', exporter)] : [el('p', { textContent: 'Aucun appel sur cette période.' })]));
      }

      zone.replaceChildren(periode.noeud,
        el('p', { className: 'vide', textContent: 'Inscrit : inscription Raid-Helper hors Absence.' }),
        resultat);
      charger();
    }

    // Stats joueurs (officiers) : comparaison ou tableau ; mode et joueurs comparés gardés d'une ouverture à l'autre
    let modeStats = 'comparer', compares = []; // compares : [{ joueur, nom }], 4 au plus
    function statsJoueurs() {
      const zone = el('div', { className: 'large' });
      ouvrir(fermer(), el('h2', { textContent: 'Stats joueurs' }),
        el('div', { className: 'onglets', role: 'tablist' }, ...Object.entries({ comparer: 'Comparer', tableau: 'Tous les joueurs' }).map(([m, t]) =>
          el('button', { type: 'button', role: 'tab', textContent: t, ariaSelected: m === modeStats, onclick: () => { modeStats = m; statsJoueurs(); } }))),
        zone);
      (modeStats === 'comparer' ? comparer : stats)(zone);
    }

    // graphiques en SVG / CSS, sans bibliothèque
    const pourcent = (a, b) => b ? Math.round(100 * a / b) : null;
    const barre = v => el('span', { className: 'barre', title: v + ' %' }, el('span', { style: `width: ${v}%` }));
    const REPARTITION = [['presents_seuls', 'Présent'], ['retards', 'Retard'], ['bancs', 'Banc'], ['absents_prevenus', 'Absent prévenu'], ['absents', 'Absent']];
    const repartition = r => el('span', { className: 'repartition', role: 'img', ariaLabel: REPARTITION.map(([k, t]) => `${t} ${r[k]}`).join(', ') },
      ...REPARTITION.filter(([k]) => r[k]).map(([k, t]) => el('span', { className: 'r-' + k, title: `${t} : ${r[k]}`, style: `flex: ${r[k]}` })));
    const courbe = valeurs => { // une valeur 0–100 par semaine, null sans soirée
      const l = 120, h = 36, points = valeurs.map((v, i) => v == null ? null
        : [valeurs.length > 1 ? Math.round(i * l / (valeurs.length - 1)) : l / 2, Math.round(h - 3 - v * (h - 6) / 100)]).filter(Boolean);
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', `0 0 ${l} ${h}`);
      svg.setAttribute('class', 'courbe');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'En raid par semaine : ' + valeurs.map(v => v == null ? '–' : v + ' %').join(', '));
      svg.innerHTML = `<line x1="0" y1="3" x2="${l}" y2="3"/><polyline points="${points.map(p => p.join(',')).join(' ')}"/>`
        + points.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2"/>`).join(''); // nombres seulement : pas d'injection
      return svg;
    };

    function comparer(zone) {
      const resultat = el('div');
      const periode = choixPeriode(() => charger(), '3m');
      let demande = 0;
      async function charger() {
        const debut = periode.debut(), depuis = depuisIso(debut), n = ++demande, ids = compares.map(c => c.joueur);
        const [{ data, error }, { data: appels }, { data: loots }] = await Promise.all([
          sb.rpc('stats_joueurs', { depuis }),
          ids.length ? sb.from('appel').select('joueur, etat, sorties!inner(debut)').in('joueur', ids).gte('sorties.debut', depuis ?? '1970-01-01') : { data: [] },
          ids.length ? sb.from('loots').select('joueur, personnage').in('joueur', ids).gte('le', depuis ?? '1970-01-01') : { data: [] }]);
        if (n !== demande) return;
        if (error) return resultat.replaceChildren(el('p', { textContent: 'Statistiques indisponibles : ' + error.message }));
        const parJoueur = new Map(data.map(r => [r.joueur, completer(r)]));
        const tous = data.filter(r => r.nom).sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
        const options = (choisi, vide) => [el('option', { value: '', textContent: vide }),
          ...tous.filter(r => r.joueur === choisi || !compares.some(c => c.joueur === r.joueur)).map(r => el('option', { value: r.joueur, textContent: r.nom + (r.joueur.startsWith('nom:') ? ' (non inscrit)' : ''), selected: r.joueur === choisi }))];
        const plein = compares.length >= 4;
        const ajout = el('select', { ariaLabel: 'Ajouter un joueur', disabled: plein, onchange: e => {
          const r = parJoueur.get(e.target.value);
          if (r && !compares.some(c => c.joueur === r.joueur)) compares.push({ joueur: r.joueur, nom: r.nom });
          charger();
        } }, ...options(null, plein ? '4 joueurs au plus' : '+ Ajouter un joueur'));
        const changer = i => e => { const r = parJoueur.get(e.target.value); if (r) compares[i] = { joueur: r.joueur, nom: r.nom }; charger(); };

        // évolution : par semaine depuis le début de la période (ou la première soirée appelée des joueurs comparés)
        const origine = depuis ? Date.parse(depuis) : Math.min(Date.now(), ...(appels ?? []).map(a => Date.parse(a.sorties.debut)));
        const semaines = Math.max(1, Math.ceil((Date.now() - origine) / 6048e5));
        const evolution = j => {
          const sem = Array.from({ length: semaines }, () => [0, 0]); // [en raid, dispo]
          for (const a of appels ?? []) if (a.joueur === j && ['present', 'retard', 'banc'].includes(a.etat)) {
            const s = sem[Math.max(0, Math.min(semaines - 1, Math.floor((Date.parse(a.sorties.debut) - origine) / 6048e5)))];
            s[1]++; if (a.etat === 'present' || a.etat === 'retard') s[0]++;
          }
          return courbe(sem.map(([p, t]) => pourcent(p, t)));
        };
        const parPerso = j => Object.entries(Object.groupBy((loots ?? []).filter(l => l.joueur === j), l => l.personnage ?? 'à son nom'))
          .map(([p, l]) => `${p} ${l.length}`).join(', ') || '–';
        const date = d => new Date(d).toLocaleDateString('fr-FR', { timeZone: 'Europe/Paris', day: 'numeric', month: 'short' });

        // [titre, valeur(stats, joueur)] ; sans valeur : titre de section
        const LIGNES = [['Présence'],
          ['Soirées', r => r.toutes],
          ['Dispo', r => r.dispo],
          ['En raid', r => { const v = pourcent(r.presents, r.dispo); return v == null ? '–' : [`${r.presents} · ${v} % `, barre(v)]; }],
          ['Mis au banc', r => r.bancs],
          ['Retard', r => r.presents ? `${pourcent(r.retards, r.presents)} %` + (r.retard_moyen != null ? ` · ${r.retard_moyen} min en moyenne` : '') : '–'],
          ['Absent prévenu', r => r.absents_prevenus],
          ['Absent', r => r.absents],
          ['Répartition', r => repartition(r)],
          ['En raid par semaine', (r, j) => evolution(j)],
          ['Inscriptions Raid-Helper'],
          ['Inscrit', r => r.inscrits],
          ['Inscrit et validé', r => r.inscrits_valides],
          ['Inscrit et en raid', r => r.inscrits_presents],
          ['Inscrit et mis au banc', r => r.inscrits_bancs],
          ['Loots'],
          ['Reçus', r => r.loots],
          ['Par soirée en raid', r => r.presents ? (r.loots / r.presents).toFixed(2).replace('.', ',') : '–'],
          ['Dernier loot', r => r.dernier_loot ? `${r.dernier_loot} (${date(r.dernier_loot_le)})` : '–'],
          ['Par personnage', (r, j) => parPerso(j)]];
        const contenuCase = v => Array.isArray(v) ? v : [v instanceof Node ? v : String(v ?? '–')];

        resultat.replaceChildren(compares.length ? el('div', { className: 'stats' }, el('table', { className: 'compare' },
          el('thead', {}, el('tr', {}, el('th', {}, ajout), ...compares.map((c, i) => el('th', {},
            el('select', { ariaLabel: 'Joueur comparé', onchange: changer(i) }, ...options(c.joueur, c.nom)), el('br'),
            el('button', { className: 'lien', type: 'button', textContent: 'Voir', onclick: () => suivi(c.joueur, c.nom, statsJoueurs) }),
            el('button', { className: 'lien', type: 'button', textContent: 'Retirer', onclick: () => { compares.splice(i, 1); charger(); } }))))),
          el('tbody', {}, ...LIGNES.map(([titre, valeur]) => valeur
            ? el('tr', {}, el('th', { textContent: titre }), ...compares.map(c => {
                const r = parJoueur.get(c.joueur);
                return el('td', {}, ...(r ? contenuCase(valeur(r, c.joueur)) : ['–']));
              }))
            : el('tr', { className: 'section' }, el('th', { colSpan: compares.length + 1, textContent: titre }))))))
          : el('p', {}, ajout, ' Choisissez les joueurs à comparer (4 au plus).'),
          compares.length ? el('p', { className: 'legende' }, ...REPARTITION.map(([k, t]) => el('span', {}, el('span', { className: 'r-' + k }), ' ' + t + ' '))) : '',
          el('p', { className: 'vide', textContent: 'Un joueur sans soirée appelée sur la période affiche –.' }));
      }
      zone.replaceChildren(periode.noeud, resultat);
      charger();
    }

    // « zoom » sur une sortie : fenêtre native par-dessus le calendrier, fermée uniquement par la croix
    // (ni Échap ni clic à côté : un appel en cours de saisie ne se perd pas par mégarde)
    const zoom = document.getElementById('zoom');
    const fermer = () => el('button', { className: 'fermer', textContent: '×', ariaLabel: 'Fermer', onclick: () => { brouillon = null; zoom.close(); } });
    let brouillon = null; // appel modifié et pas encore enregistré : { id de la sortie, lignes }
    const ouvrir = (...enfants) => {
      zoom.replaceChildren(el('div', { className: 'zoom-in' }, ...enfants));
      if (!zoom.open) zoom.showModal();
    };
    zoom.addEventListener('cancel', e => e.preventDefault()); // Échap, pour les navigateurs sans closedby

    // une vérification par changement réel d'utilisateur : au chargement, INITIAL_SESSION et SIGNED_IN
    // arrivent tous deux (dans un ordre variable) et lanceraient deux synchronisations concurrentes
    let utilisateur = 0; // 0 = pas encore vérifié (distinct de undefined = déconnecté)
    sb.auth.onAuthStateChange((evt, session) => {
      if (session?.user.id === utilisateur) return;
      utilisateur = session?.user.id;
      setTimeout(verifier);
    });
  </script>
</body>
</html>
