<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace guilde — Le Royaume</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="brand" href="index.html"><img src="img/logo.webp" alt=""><span>Le Royaume</span></a>
    <a href="index.html">Accueil</a>
    <a href="charte.html">Charte</a>
    <a href="index.html#rejoindre">Nous rejoindre</a>
  </nav>

  <main class="espace">
    <h1>Espace guilde</h1>
    <div id="etat" aria-live="polite"><p>Chargement…</p></div>
    <div id="contenu"></div>
    <dialog id="zoom" class="zoom" closedby="none"></dialog>
  </main>

  <footer>Le Royaume — guilde francophone sur World of Warcraft Forever.<br>World of Warcraft est une marque de Blizzard Entertainment.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script>
    // Adresse et clé publique du projet Supabase (publiques par conception : la sécurité repose
    // sur la vérification côté serveur et les règles d'accès de la base, pas sur ces valeurs).
    const SUPABASE_URL = 'https://gobvfbwuesskhrgcrzjd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BJwMSdlBLfltRGA-GCELrQ_MbyCM1x_';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const etat = document.getElementById('etat');
    const contenu = document.getElementById('contenu');
    let officier = false;

    // crée un élément ; les textes passent par textContent (pas d'injection possible)
    const el = (tag, { dataset, ...props } = {}, ...enfants) => {
      const e = Object.assign(document.createElement(tag), props);
      Object.assign(e.dataset, dataset); // dataset est en lecture seule : on remplit l'existant
      e.append(...enfants.filter(x => x != null && x !== false));
      return e;
    };
    // remplace le contenu de la zone d'état
    const afficher = (texte, bouton) => etat.replaceChildren(el('p', { textContent: texte }), ...(bouton ? [bouton] : []));
    const bouton = (texte, classe, action) => el('button', { className: 'btn ' + classe, textContent: texte, onclick: action });
    const connexion = () => sb.auth.signInWithOAuth({
      provider: 'discord',
      options: { scopes: 'identify', redirectTo: location.origin + location.pathname },
    });
    const deconnexion = () => sb.auth.signOut(); // l'événement SIGNED_OUT relance verifier()
    const quand = d => new Date(d).toLocaleString('fr-FR', { timeZone: 'Europe/Paris',
      weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

    async function verifier() {
      contenu.replaceChildren();
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return afficher('Cet espace est réservé aux membres de la guilde. Connectez-vous avec votre compte Discord.',
        bouton('Se connecter avec Discord', 'discord', connexion));

      afficher('Vérification de votre rôle sur le Discord de la guilde…');
      const { data, error } = await sb.functions.invoke('verifier-role');
      if (error) return afficher('La vérification a échoué. Réessayez plus tard.', bouton('Se déconnecter', '', deconnexion));
      if (!data.membre) return afficher("Ce compte Discord n'est pas sur le serveur de la guilde.", bouton('Se déconnecter', '', deconnexion));
      officier = data.autorise;
      afficher(`Bienvenue ${data.pseudo}${officier ? ', accès officier confirmé' : ''}.`, bouton('Se déconnecter', '', deconnexion));

      contenu.replaceChildren(el('p', { textContent: 'Récupération des sorties Raid-Helper…' }));
      const synchro = await sb.functions.invoke('synchro-raidhelper');
      // le message du serveur (ex. « Raid-Helper a répondu 401 ») aide à comprendre une panne
      const detail = synchro.error && await synchro.error.context?.json?.().then(d => d.erreur, () => null);
      calendrier(synchro.error ? `Synchronisation Raid-Helper impossible${detail ? ' (' + detail + ')' : ''} : les sorties affichées peuvent dater un peu.` : null);
    }

    // Calendrier mensuel (semaines du lundi au dimanche, heure de Paris)
    const jourParis = d => new Date(d).toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }); // AAAA-MM-JJ
    const heure = d => new Date(d).toLocaleTimeString('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' });
    let mois = new Date(jourParis(Date.now()).slice(0, 7) + '-01T12:00'); // midi : à l'abri des changements d'heure
    let avertissementSynchro = null;

    async function calendrier(avertissement = avertissementSynchro) {
      avertissementSynchro = avertissement;
      const debut = new Date(mois); debut.setDate(1 - (mois.getDay() + 6) % 7); // lundi de la 1re semaine
      const jours = Array.from({ length: 42 }, (_, i) => { const d = new Date(debut); d.setDate(debut.getDate() + i); return d; });
      const { data, error } = await sb.from('sorties').select('id, titre, debut, inscriptions(count)')
        .gte('debut', new Date(debut.getTime() - 86400e3).toISOString())
        .lt('debut', new Date(jours[41].getTime() + 86400e3).toISOString()).order('debut');
      if (error) return contenu.replaceChildren(el('p', { textContent: 'Calendrier indisponible pour le moment.' }));

      const parJour = Map.groupBy(data, s => jourParis(s.debut));
      const aujourdhui = jourParis(Date.now());
      const changer = n => () => { mois.setMonth(mois.getMonth() + n); calendrier(); };
      const cases = jours.map(d => {
        const cle = jourParis(d);
        return el('div', { className: 'jour' + (d.getMonth() !== mois.getMonth() ? ' autre' : '') + (cle === aujourdhui ? ' auj' : '') },
          el('span', { className: 'num', textContent: d.getDate() }),
          ...(parJour.get(cle) ?? []).map(s => el('button', { className: 'ev', title: s.titre || 'Sortie', onclick: () => sortie(s.id) },
            el('time', { textContent: heure(s.debut) }), el('span', { textContent: ' ' + (s.titre || 'Sortie') }),
            el('small', { textContent: ` · ${s.inscriptions[0].count}` }))));
      });
      contenu.replaceChildren(
        ...(avertissement ? [el('p', { className: 'vide', textContent: avertissement })] : []),
        el('div', { className: 'cal-tete' },
          el('button', { className: 'nav-mois', textContent: '‹', ariaLabel: 'Mois précédent', onclick: changer(-1) }),
          el('h2', { textContent: mois.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }) }),
          el('button', { className: 'nav-mois', textContent: '›', ariaLabel: 'Mois suivant', onclick: changer(1) })),
        el('div', { className: 'cal' },
          ...['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'].map(j => el('div', { className: 'jsem', textContent: j })),
          ...cases));
    }

    // Raid-Helper range les absents, retards, incertains et remplaçants comme des « classes »
    const PREREMPLI = { Absence: 'absent_prevenu', Late: 'retard', Bench: 'banc', Tentative: null };
    const ETATS = { present: 'Présent', retard: 'Retard', absent_prevenu: 'Absent prévenu', absent: 'Absent', banc: 'Banc' };

    async function sortie(id) {
      const [{ data: s }, { data: inscrits }, { data: appel }] = await Promise.all([
        sb.from('sorties').select('*').eq('id', id).single(),
        sb.from('inscriptions').select('*').eq('sortie_id', id).order('position'),
        officier ? sb.from('appel').select('*').eq('sortie_id', id) : { data: [] },
      ]);
      if (!s) return;
      const entete = [el('button', { className: 'fermer', textContent: '×', ariaLabel: 'Fermer', onclick: () => zoom.close() }),
        el('h2', { textContent: s.titre || 'Sortie' }),
        el('p', { textContent: quand(s.debut) + (s.chef ? ' — menée par ' + s.chef : '') })];
      const detail = i => [i.spe, i.classe].filter(Boolean).join(' ');

      if (!officier) return ouvrir(...entete, el('ul', { className: 'inscrits' },
        ...inscrits.map(i => el('li', {}, el('strong', { textContent: i.nom }), el('span', { textContent: ' ' + detail(i) })))));

      // Appel : celui déjà saisi, sinon pré-rempli avec les inscriptions
      const saisi = new Map(appel.map(a => [a.joueur, a]));
      const lignes = el('div', { className: 'appel' });
      // les non-inscrits Raid-Helper peuvent être retirés (effectif à l'enregistrement)
      const ligne = (joueur, nom, info, etatInitial, minutes, retirable) => lignes.append(
        el('fieldset', { className: 'ligne', dataset: { joueur, nom } },
          el('legend', {}, el('strong', { textContent: nom }), info && el('span', { textContent: ' ' + info }),
            retirable && el('button', { className: 'retirer', type: 'button', textContent: '×', title: "Retirer de l'appel",
              ariaLabel: 'Retirer ' + nom + " de l'appel", onclick: e => e.target.closest('.ligne').remove() })),
          ...Object.entries(ETATS).map(([v, t]) => el('label', {},
            el('input', { type: 'radio', name: 'e' + joueur, value: v, checked: v === etatInitial }), ' ' + t)),
          el('label', { className: 'min' }, el('input', { type: 'number', min: 0, value: minutes ?? '', placeholder: '?' }), ' min')));
      for (const i of inscrits) {
        const a = saisi.get(i.discord_id);
        ligne(i.discord_id, i.nom, detail(i), a ? a.etat : (i.classe in PREREMPLI ? PREREMPLI[i.classe] : 'present'), a?.retard_min);
      }
      for (const a of appel) if (!inscrits.some(i => i.discord_id === a.joueur)) ligne(a.joueur, a.nom, 'non inscrit', a.etat, a.retard_min, true);

      const nouveau = el('input', { type: 'text', placeholder: 'Joueur non inscrit' });
      const ajouter = bouton('Ajouter', '', () => {
        const nom = nouveau.value.trim();
        if (nom) ligne('nom:' + nom.toLowerCase(), nom, 'non inscrit', 'present', null, true);
        nouveau.value = '';
      });
      const dernier = appel.reduce((a, b) => (a && a.modifie_le > b.modifie_le ? a : b), null);
      const message = el('p', { className: 'vide', textContent: dernier
        ? `Appel enregistré, dernière modification par ${dernier.modifie_par} le ${quand(dernier.modifie_le)}.`
        : 'Appel pas encore fait : pré-rempli avec les inscriptions Raid-Helper.' });

      const enregistrer = bouton("Enregistrer l'appel", 'discord', async () => {
        const rangs = [...lignes.querySelectorAll('.ligne')].map(f => {
          const e = f.querySelector('input[type=radio]:checked')?.value;
          const min = f.querySelector('input[type=number]').value;
          return e && { sortie_id: id, joueur: f.dataset.joueur, nom: f.dataset.nom, etat: e,
            retard_min: e === 'retard' && min !== '' ? +min : null };
        }).filter(Boolean)
          // seules les lignes nouvelles ou modifiées partent (et sont donc journalisées)
          .filter(r => { const a = saisi.get(r.joueur); return !a || a.etat !== r.etat || a.retard_min !== r.retard_min; });
        const presents = new Set([...lignes.querySelectorAll('.ligne')].map(f => f.dataset.joueur));
        const retires = [...saisi.keys()].filter(j => !presents.has(j));
        if (!rangs.length && !retires.length) return message.textContent = 'Aucune modification.';
        const { error } = rangs.length ? await sb.from('appel').upsert(rangs) : {};
        const { error: e2 } = retires.length ? await sb.from('appel').delete().eq('sortie_id', id).in('joueur', retires) : {};
        if (error || e2) return message.textContent = "L'enregistrement a échoué : " + (error || e2).message;
        sortie(id);
        calendrier(); // nombre d'inscrits à jour derrière la fenêtre
      });
      ouvrir(...entete, message, lignes, el('p', {}, nouveau, ajouter), enregistrer);
    }

    // « zoom » sur une sortie : fenêtre native par-dessus le calendrier, fermée uniquement par la croix
    // (ni Échap ni clic à côté : un appel en cours de saisie ne se perd pas par mégarde)
    const zoom = document.getElementById('zoom');
    const ouvrir = (...enfants) => {
      zoom.replaceChildren(el('div', { className: 'zoom-in' }, ...enfants));
      if (!zoom.open) zoom.showModal();
    };
    zoom.addEventListener('cancel', e => e.preventDefault()); // Échap, pour les navigateurs sans closedby

    // une vérification par changement réel d'utilisateur : au chargement, INITIAL_SESSION et SIGNED_IN
    // arrivent tous deux (dans un ordre variable) et lanceraient deux synchronisations concurrentes
    let utilisateur = 0; // 0 = pas encore vérifié (distinct de undefined = déconnecté)
    sb.auth.onAuthStateChange((evt, session) => {
      if (session?.user.id === utilisateur) return;
      utilisateur = session?.user.id;
      setTimeout(verifier);
    });
  </script>
</body>
</html>
