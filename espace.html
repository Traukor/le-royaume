<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espace guilde — Le Royaume</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="brand" href="index.html"><img src="img/logo.webp" alt=""><span>Le Royaume</span></a>
    <a href="index.html">Accueil</a>
    <a href="charte.html">Charte</a>
    <a href="index.html#rejoindre">Nous rejoindre</a>
  </nav>

  <main class="espace">
    <h1>Espace guilde</h1>
    <div id="etat" aria-live="polite"><p>Chargement…</p></div>
    <div id="contenu"></div>
    <dialog id="zoom" class="zoom" closedby="none"></dialog>
  </main>

  <footer>Le Royaume — guilde francophone sur World of Warcraft Forever.<br>World of Warcraft est une marque de Blizzard Entertainment.</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script>
    // Adresse et clé publique du projet Supabase (publiques par conception : la sécurité repose
    // sur la vérification côté serveur et les règles d'accès de la base, pas sur ces valeurs).
    const SUPABASE_URL = 'https://gobvfbwuesskhrgcrzjd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BJwMSdlBLfltRGA-GCELrQ_MbyCM1x_';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const etat = document.getElementById('etat');
    const contenu = document.getElementById('contenu');
    let officier = false;

    // crée un élément ; les textes passent par textContent (pas d'injection possible)
    const el = (tag, { dataset, ...props } = {}, ...enfants) => {
      const e = Object.assign(document.createElement(tag), props);
      Object.assign(e.dataset, dataset); // dataset est en lecture seule : on remplit l'existant
      e.append(...enfants.filter(x => x != null && x !== false));
      return e;
    };
    // remplace le contenu de la zone d'état
    const afficher = (texte, bouton) => etat.replaceChildren(el('p', { textContent: texte }), ...(bouton ? [bouton] : []));
    const bouton = (texte, classe, action) => el('button', { className: 'btn ' + classe, textContent: texte, onclick: action });
    const connexion = () => sb.auth.signInWithOAuth({
      provider: 'discord',
      options: { scopes: 'identify', redirectTo: location.origin + location.pathname },
    });
    const deconnexion = () => sb.auth.signOut(); // l'événement SIGNED_OUT relance verifier()
    const quand = d => new Date(d).toLocaleString('fr-FR', { timeZone: 'Europe/Paris',
      weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

    async function verifier() {
      contenu.replaceChildren();
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return afficher('Cet espace est réservé aux membres de la guilde. Connectez-vous avec votre compte Discord.',
        bouton('Se connecter avec Discord', 'discord', connexion));

      afficher('Vérification de votre rôle sur le Discord de la guilde…');
      const { data, error } = await sb.functions.invoke('verifier-role');
      if (error) return afficher('La vérification a échoué. Réessayez plus tard.', bouton('Se déconnecter', '', deconnexion));
      if (!data.membre) return afficher("Ce compte Discord n'est pas sur le serveur de la guilde.", bouton('Se déconnecter', '', deconnexion));
      officier = data.autorise;
      moi = session.user.user_metadata.provider_id ?? session.user.user_metadata.sub;
      chargerAbsences();
      afficher(`Bienvenue ${data.pseudo}${officier ? ', accès officier confirmé' : ''}.`, bouton('Se déconnecter', '', deconnexion));

      contenu.replaceChildren(el('p', { textContent: 'Récupération des sorties Raid-Helper…' }));
      const synchro = await sb.functions.invoke('synchro-raidhelper');
      // le message du serveur (ex. « Raid-Helper a répondu 401 ») aide à comprendre une panne
      const detail = synchro.error && await synchro.error.context?.json?.().then(d => d.erreur, () => null);
      calendrier(synchro.error ? `Synchronisation Raid-Helper impossible${detail ? ' (' + detail + ')' : ''} : les sorties affichées peuvent dater un peu.` : null);
    }

    // Calendrier mensuel (semaines du lundi au dimanche, heure de Paris)
    const jourParis = d => new Date(d).toLocaleDateString('sv-SE', { timeZone: 'Europe/Paris' }); // AAAA-MM-JJ
    const heure = d => new Date(d).toLocaleTimeString('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' });
    let mois = new Date(jourParis(Date.now()).slice(0, 7) + '-01T12:00'); // midi : à l'abri des changements d'heure
    let avertissementSynchro = null;

    async function calendrier(avertissement = avertissementSynchro) {
      avertissementSynchro = avertissement;
      const debut = new Date(mois); debut.setDate(1 - (mois.getDay() + 6) % 7); // lundi de la 1re semaine
      const jours = Array.from({ length: 42 }, (_, i) => { const d = new Date(debut); d.setDate(debut.getDate() + i); return d; });
      const { data, error } = await sb.from('sorties').select('id, titre, debut, inscriptions(count)')
        .gte('debut', new Date(debut.getTime() - 86400e3).toISOString())
        .lt('debut', new Date(jours[41].getTime() + 86400e3).toISOString()).order('debut');
      if (error) return contenu.replaceChildren(el('p', { textContent: 'Calendrier indisponible pour le moment.' }));

      const parJour = Map.groupBy(data, s => jourParis(s.debut));
      const aujourdhui = jourParis(Date.now());
      const changer = n => () => { mois.setMonth(mois.getMonth() + n); calendrier(); };
      const cases = jours.map(d => {
        const cle = jourParis(d);
        return el('div', { className: 'jour' + (d.getMonth() !== mois.getMonth() ? ' autre' : '') + (cle === aujourdhui ? ' auj' : '') },
          el('span', { className: 'num', textContent: d.getDate() }),
          ...(parJour.get(cle) ?? []).map(s => el('button', { className: 'ev', title: s.titre || 'Sortie', onclick: () => sortie(s.id) },
            el('time', { textContent: heure(s.debut) }), el('span', { textContent: ' ' + (s.titre || 'Sortie') }),
            el('small', { textContent: ` · ${s.inscriptions[0].count}` }))));
      });
      contenu.replaceChildren(
        ...(avertissement ? [el('p', { className: 'vide', textContent: avertissement })] : []),
        ...(officier ? [el('p', { className: 'outils' }, bouton('Statistiques', '', () => stats()), ' ', bouton('Actualiser', '', actualiser))] : []),
        el('div', { className: 'cal-tete' },
          el('button', { className: 'nav-mois', textContent: '‹', ariaLabel: 'Mois précédent', onclick: changer(-1) }),
          el('h2', { textContent: mois.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }) }),
          el('button', { className: 'nav-mois', textContent: '›', ariaLabel: 'Mois suivant', onclick: changer(1) })),
        el('div', { className: 'cal' },
          ...['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'].map(j => el('div', { className: 'jsem', textContent: j })),
          ...cases),
        blocAbsences);
    }

    // synchronisation immédiate, sans attendre le délai de 5 minutes (officiers)
    async function actualiser(e) {
      e.target.disabled = true;
      e.target.textContent = 'Actualisation…';
      const { error } = await sb.functions.invoke('synchro-raidhelper', { body: { forcer: true } });
      calendrier(error ? 'Actualisation impossible pour le moment.' : null);
    }

    // Raid-Helper range les absents, retards, incertains et remplaçants comme des « classes »
    const PREREMPLI = { Absence: 'absent_prevenu', Late: 'retard', Bench: 'banc', Tentative: null };
    const SPECIAUX = { Absence: 'Absents', Late: 'En retard', Tentative: 'Incertains', Bench: 'Remplaçants' };
    const ETATS = { present: 'Présent', retard: 'Retard', absent_prevenu: 'Absent prévenu', absent: 'Absent', banc: 'Banc' };
    // rôle Raid-Helper (« Tanks », « Healers »…) ou, à défaut, classe de rôle (« Tank », « Healer »…)
    const roleDe = i => { const r = `${i.role} ${i.classe}`.toLowerCase();
      return r.includes('tank') ? 'Tanks' : r.includes('heal') ? 'Soigneurs' : /melee|ranged|dps/.test(r) ? 'DPS' : 'Autres'; };
    const CIBLES = { Tanks: 2, Soigneurs: 5, DPS: 12 }; // par défaut ; réglables par sortie (table cibles)
    const COLONNES_CIBLES = { Tanks: 'tanks', Soigneurs: 'soigneurs', DPS: 'dps' };
    const STATUTS = { '': '—', valide: 'Validé', attente: 'En attente' };

    async function sortie(id, onglet) {
      const [{ data: s }, { data: inscrits }, { data: appel }, { data: compo }, { data: reglage }] = await Promise.all([
        sb.from('sorties').select('*').eq('id', id).single(),
        sb.from('inscriptions').select('*').eq('sortie_id', id).order('position'),
        officier ? sb.from('appel').select('*').eq('sortie_id', id) : { data: [] },
        sb.from('composition').select('*').eq('sortie_id', id),
        sb.from('cibles').select('*').eq('sortie_id', id).maybeSingle(),
      ]);
      if (!s) return;
      const jour = jourParis(s.debut);
      const { data: absents } = await sb.rpc('absents', { jour }); // absences déclarées couvrant la soirée
      const entete = [fermer(), el('h2',{ textContent: s.titre || 'Sortie' }),
        el('p', { textContent: quand(s.debut) + (s.chef ? ' — menée par ' + s.chef : '') })];
      const detail = i => [i.spe, i.classe].filter(Boolean).join(' ');
      const statut = new Map((compo ?? []).map(c => [c.joueur, c.statut]));
      const absent = new Set(absents ?? []);

      // Composition : inscrits par rôle, avec la cible ; les officiers valident ou mettent en attente
      const message = el('p', { className: 'vide' });
      const choisir = i => el('select', { className: 'statut', ariaLabel: 'Statut de ' + i.nom, onchange: async e => {
        const v = e.target.value;
        const { error } = v ? await sb.from('composition').upsert({ sortie_id: id, joueur: i.discord_id, statut: v })
          : await sb.from('composition').delete().eq('sortie_id', id).eq('joueur', i.discord_id);
        if (error) return message.textContent = "L'enregistrement a échoué : " + error.message;
        sortie(id, 'composition'); // compteurs à jour
      } }, ...Object.entries(STATUTS).map(([v, t]) => el('option', { value: v, textContent: t, selected: v === (statut.get(i.discord_id) ?? '') })));
      // une absence déclarée range l'inscrit parmi les absents, quel que soit son bouton Raid-Helper
      const groupes = Map.groupBy(inscrits, i => absent.has(i.discord_id) ? SPECIAUX.Absence : SPECIAUX[i.classe] ?? roleDe(i));
      const cible = g => reglage?.[COLONNES_CIBLES[g]] ?? CIBLES[g];
      const regler = g => el('input', { type: 'number', min: 0, value: cible(g), className: 'cible', ariaLabel: 'Cible ' + g,
        onchange: async e => {
          const valeurs = Object.fromEntries(Object.keys(CIBLES).map(k => [COLONNES_CIBLES[k], cible(k)]));
          const { error } = await sb.from('cibles').upsert({ sortie_id: id, ...valeurs, [COLONNES_CIBLES[g]]: +e.target.value });
          if (error) return message.textContent = "L'enregistrement a échoué : " + error.message;
          sortie(id, 'composition');
        } });
      const ordre = ['Tanks', 'Soigneurs', 'DPS', 'Autres', ...Object.values(SPECIAUX)];
      const composition = el('div', { className: 'compo' }, ...ordre.filter(g => groupes.has(g) || CIBLES[g]).map(g => {
        const liste = groupes.get(g) ?? [];
        const valides = liste.filter(i => statut.get(i.discord_id) === 'valide').length;
        return el('section', {},
          el('h3', {}, g + (CIBLES[g] ? ` ${liste.length} / ` : ` (${liste.length})`),
            CIBLES[g] && (officier ? regler(g) : String(cible(g))),
            valides ? ` · ${valides} validé${valides > 1 ? 's' : ''}` : ''),
          el('ul', { className: 'inscrits' }, ...liste.map(i => el('li', {},
            el('strong', { textContent: i.nom }), el('span', { textContent: ' ' + detail(i) }),
            absent.has(i.discord_id) && el('em', { textContent: ' absence déclarée' }),
            officier ? choisir(i) : statut.has(i.discord_id) && el('em', { textContent: ' ' + STATUTS[statut.get(i.discord_id)].toLowerCase() })))));
      }));
      if (!officier) return ouvrir(...entete, composition);

      // Appel : celui déjà saisi, sinon pré-rempli (inscription Raid-Helper, absence déclarée, liste d'attente)
      const saisi = new Map(appel.map(a => [a.joueur, a]));
      const lignes = el('div', { className: 'appel' });
      // les non-inscrits Raid-Helper peuvent être retirés (effectif à l'enregistrement)
      const ligne = (joueur, nom, info, etatInitial, minutes, retirable) => lignes.append(
        el('fieldset', { className: 'ligne', dataset: { joueur, nom } },
          el('legend', {}, el('strong', { textContent: nom }), info && el('span', { textContent: ' ' + info }),
            retirable && el('button', { className: 'retirer', type: 'button', textContent: '×', title: "Retirer de l'appel",
              ariaLabel: 'Retirer ' + nom + " de l'appel", onclick: e => e.target.closest('.ligne').remove() })),
          ...Object.entries(ETATS).map(([v, t]) => el('label', {},
            el('input', { type: 'radio', name: 'e' + joueur, value: v, checked: v === etatInitial }), ' ' + t)),
          el('label', { className: 'min' }, el('input', { type: 'number', min: 0, value: minutes ?? '', placeholder: '?' }), ' min')));
      // absence déclarée : hors de la liste, enregistré « absent prévenu » avec l'appel
      const declares = inscrits.filter(i => absent.has(i.discord_id));
      for (const i of inscrits) {
        if (absent.has(i.discord_id)) continue;
        const a = saisi.get(i.discord_id), att = statut.get(i.discord_id) === 'attente';
        const prevu = i.classe in PREREMPLI ? PREREMPLI[i.classe] : att ? 'banc' : 'present';
        ligne(i.discord_id, i.nom, [detail(i), att && 'en attente'].filter(Boolean).join(' · '), a ? a.etat : prevu, a?.retard_min);
      }
      for (const a of appel) if (!inscrits.some(i => i.discord_id === a.joueur)) ligne(a.joueur, a.nom, 'non inscrit', a.etat, a.retard_min, true);

      const nouveau = el('input', { type: 'text', placeholder: 'Joueur non inscrit' });
      const ajouter = bouton('Ajouter', '', () => {
        const nom = nouveau.value.trim();
        if (nom) ligne('nom:' + nom.toLowerCase(), nom, 'non inscrit', 'present', null, true);
        nouveau.value = '';
      });
      const dernier = appel.reduce((a, b) => (a && a.modifie_le > b.modifie_le ? a : b), null);
      const etatAppel = el('p', { className: 'vide', textContent: dernier
        ? `Appel enregistré, dernière modification par ${dernier.modifie_par} le ${quand(dernier.modifie_le)}.`
        : "Appel pas encore fait : pré-rempli avec les inscriptions Raid-Helper et la liste d'attente." });

      const enregistrer = bouton("Enregistrer l'appel", 'discord', async () => {
        const rangs = [...lignes.querySelectorAll('.ligne')].map(f => {
          const e = f.querySelector('input[type=radio]:checked')?.value;
          const min = f.querySelector('input[type=number]').value;
          return e && { sortie_id: id, joueur: f.dataset.joueur, nom: f.dataset.nom, etat: e,
            retard_min: e === 'retard' && min !== '' ? +min : null };
        }).filter(Boolean)
          .concat(declares.map(i => ({ sortie_id: id, joueur: i.discord_id, nom: i.nom, etat: 'absent_prevenu', retard_min: null })))
          // seules les lignes nouvelles ou modifiées partent (et sont donc journalisées)
          .filter(r => { const a = saisi.get(r.joueur); return !a || a.etat !== r.etat || a.retard_min !== r.retard_min; });
        const presents = new Set([...lignes.querySelectorAll('.ligne')].map(f => f.dataset.joueur).concat(declares.map(i => i.discord_id)));
        const retires = [...saisi.keys()].filter(j => !presents.has(j));
        if (!rangs.length && !retires.length) return etatAppel.textContent = 'Aucune modification.';
        const { error } = rangs.length ? await sb.from('appel').upsert(rangs) : {};
        const { error: e2 } = retires.length ? await sb.from('appel').delete().eq('sortie_id', id).in('joueur', retires) : {};
        if (error || e2) return etatAppel.textContent = "L'enregistrement a échoué : " + (error || e2).message;
        sortie(id, 'appel');
        calendrier(); // nombre d'inscrits à jour derrière la fenêtre
      });

      // deux onglets : la composition avant la soirée, l'appel une fois commencée
      const panneaux = {
        composition: el('div', {}, message, composition),
        appel: el('div', {}, etatAppel,
          declares.length > 0 && el('p', { className: 'vide', textContent: 'Absence déclarée, compté absent prévenu : ' + declares.map(i => i.nom).join(', ') + '.' }),
          lignes, el('p', {}, nouveau, ajouter), enregistrer),
      };
      onglet ??= Date.parse(s.debut) > Date.now() ? 'composition' : 'appel';
      const onglets = el('div', { className: 'onglets', role: 'tablist' }, ...Object.keys(panneaux).map(k =>
        el('button', { type: 'button', role: 'tab', textContent: k === 'appel' ? 'Appel' : 'Composition', ariaSelected: k === onglet,
          onclick: e => {
            for (const b of e.target.parentNode.children) b.ariaSelected = b === e.target;
            for (const [n, p] of Object.entries(panneaux)) p.hidden = n !== k;
          } })));
      for (const [n, p] of Object.entries(panneaux)) p.hidden = n !== onglet;
      ouvrir(...entete, onglets, panneaux.composition, panneaux.appel);
    }

    // Absences longues : chacun déclare les siennes ; les officiers voient celles de tous
    const blocAbsences = el('section', { className: 'absences' });
    let moi = null; // identifiant Discord du compte connecté

    async function chargerAbsences() {
      const { data, error } = await sb.from('absences').select('*').gte('au', jourParis(Date.now())).order('du');
      if (error) return blocAbsences.replaceChildren(el('p', { textContent: 'Absences indisponibles pour le moment.' }));
      const date = d => new Date(d + 'T12:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
      const du = el('input', { type: 'date', min: jourParis(Date.now()), ariaLabel: 'Du' });
      const au = el('input', { type: 'date', min: jourParis(Date.now()), ariaLabel: 'Au' });
      const motif = el('input', { type: 'text', placeholder: 'Motif (facultatif)' });
      const message = el('p', { className: 'vide' });
      const declarer = bouton('Déclarer', '', async () => {
        if (!du.value || !au.value || au.value < du.value) return message.textContent = 'Indiquez une date de début et une date de fin dans le bon ordre.';
        const { error } = await sb.from('absences').insert({ du: du.value, au: au.value, motif: motif.value.trim() || null });
        if (error) return message.textContent = 'La déclaration a échoué : ' + error.message;
        chargerAbsences();
      });
      const supprimer = a => async () => {
        const { error } = await sb.from('absences').delete().eq('id', a.id);
        if (error) return message.textContent = 'La suppression a échoué : ' + error.message;
        chargerAbsences();
      };
      blocAbsences.replaceChildren(
        el('h2', { textContent: officier ? 'Absences déclarées' : 'Mes absences' }),
        el('p', { className: 'vide', textContent: "Vacances ou pause : déclarez-les une fois, l'appel des soirées concernées vous marque absent prévenu." }),
        data.length ? el('ul', { className: 'inscrits' }, ...data.map(a => el('li', {},
          officier && el('strong', { textContent: a.nom + ' : ' }),
          `du ${date(a.du)} au ${date(a.au)}`, a.motif && el('span', { textContent: ' — ' + a.motif }),
          a.joueur === moi && el('button', { className: 'retirer', type: 'button', textContent: '×', title: 'Supprimer',
            ariaLabel: 'Supprimer cette absence', onclick: supprimer(a) }))))
          : el('p', { textContent: 'Aucune absence à venir.' }),
        el('p', { className: 'declarer' }, el('label', {}, 'Du ', du), ' ', el('label', {}, 'au ', au), ' ', motif, ' ', declarer),
        message);
    }

    // Statistiques d'appel (officiers), triables, exportables en CSV
    const PERIODES = { '3s': '3 semaines', '3m': '3 mois', date: 'une date à choisir' };
    const debutDe = (choix, date) => { // AAAA-MM-JJ
      const d = new Date();
      if (choix === '3s') d.setDate(d.getDate() - 21); else if (choix === '3m') d.setMonth(d.getMonth() - 3); else return date;
      return jourParis(d);
    };
    const COLONNES = [['nom', 'Joueur'], ['soirees', 'Soirées'], ['presence', 'Présence %'], ['retard', 'Retard %'],
      ['retard_moyen', 'Retard moyen (min)'], ['absents_prevenus', 'Absent prévenu'], ['absents', 'Absent'], ['bancs', 'Mis au banc'],
      ['inscrits', 'Inscrit'], ['inscrits_valides', 'Inscrit et validé'], ['inscrits_presents', 'Inscrit et présent'], ['inscrits_bancs', 'Inscrit et mis au banc']];

    // la fenêtre et ses réglages sont créés une fois ; seul le résultat est recalculé
    // (sinon le sélecteur de date, recréé à chaque date valide, perdrait la saisie en cours)
    function stats() {
      let tri = 'bancs', sens = -1, debut, demande = 0;
      const liste = el('select', { ariaLabel: 'Période' },
        ...Object.entries(PERIODES).map(([v, t]) => el('option', { value: v, textContent: t })));
      const champ = el('input', { type: 'date', max: jourParis(Date.now()), ariaLabel: 'Date de début', hidden: true });
      const resultat = el('div');
      liste.onchange = () => {
        champ.hidden = liste.value !== 'date';
        if (!champ.value) champ.value = debut; // pré-rempli avec le début affiché
        charger();
      };
      champ.onchange = () => charger();

      async function charger() {
        debut = debutDe(liste.value, champ.value); // '' (date effacée) = depuis le début
        const moi = ++demande;
        const { data, error } = await sb.rpc('stats_joueurs', { depuis: debut ? new Date(debut + 'T00:00').toISOString() : null });
        if (moi !== demande) return; // une réponse plus récente est attendue (date tapée chiffre par chiffre)
        if (error) return resultat.replaceChildren(el('p', { textContent: 'Statistiques indisponibles : ' + error.message }));
        const lignes = data.map(r => ({ ...r,
          presence: r.soirees ? Math.round(100 * r.presents / r.soirees) : null,
          retard: r.presents ? Math.round(100 * r.retards / r.presents) : null }));
        const comparer = (a, b) => typeof a === 'string' ? a.localeCompare(b, 'fr') : a - b;
        lignes.sort((a, b) => a[tri] == null ? 1 : b[tri] == null ? -1 : sens * comparer(a[tri], b[tri])); // vides en dernier

        const exporter = () => {
          const cellule = v => `"${String(v ?? '').replaceAll('"', '""')}"`;
          const texte = [COLONNES.map(c => c[1]), ...lignes.map(r => COLONNES.map(([k]) => r[k]))]
            .map(l => l.map(cellule).join(';')).join('\r\n'); // « ; » et BOM : ouverture directe dans Excel en français
          el('a', { href: URL.createObjectURL(new Blob(['\ufeff' + texte], { type: 'text/csv' })),
            download: `statistiques-${debut ? 'depuis-' + debut : 'depuis-le-debut'}.csv` }).click();
        };
        const trier = k => () => { sens = k === tri ? -sens : k === 'nom' ? 1 : -1; tri = k; charger(); };
        resultat.replaceChildren(...(lignes.length ? [
          el('div', { className: 'stats' }, el('table', {},
            el('thead', {}, el('tr', {}, ...COLONNES.map(([k, t]) => el('th', {}, el('button', {
              textContent: t + (k === tri ? (sens > 0 ? ' ▲' : ' ▼') : ''), onclick: trier(k) }))))),
            el('tbody', {}, ...lignes.map(r => el('tr', {}, ...COLONNES.map(([k]) => el('td', { textContent: r[k] ?? '–' }))))))),
          bouton('Exporter en CSV', '', exporter)] : [el('p', { textContent: 'Aucun appel sur cette période.' })]));
      }

      ouvrir(fermer(), el('h2', { textContent: 'Statistiques' }),
        el('p', { className: 'periode' }, 'Depuis le ', liste, ' ', champ),
        el('p', { className: 'vide', textContent: 'Présence : Présent ou Retard sur les soirées appelées, banc exclu. Retard : retards sur les soirées jouées. Inscrit : inscription Raid-Helper hors Absence.' }),
        resultat);
      charger();
    }

    // « zoom » sur une sortie : fenêtre native par-dessus le calendrier, fermée uniquement par la croix
    // (ni Échap ni clic à côté : un appel en cours de saisie ne se perd pas par mégarde)
    const zoom = document.getElementById('zoom');
    const fermer = () => el('button', { className: 'fermer', textContent: '×', ariaLabel: 'Fermer', onclick: () => zoom.close() });
    const ouvrir = (...enfants) => {
      zoom.replaceChildren(el('div', { className: 'zoom-in' }, ...enfants));
      if (!zoom.open) zoom.showModal();
    };
    zoom.addEventListener('cancel', e => e.preventDefault()); // Échap, pour les navigateurs sans closedby

    // une vérification par changement réel d'utilisateur : au chargement, INITIAL_SESSION et SIGNED_IN
    // arrivent tous deux (dans un ordre variable) et lanceraient deux synchronisations concurrentes
    let utilisateur = 0; // 0 = pas encore vérifié (distinct de undefined = déconnecté)
    sb.auth.onAuthStateChange((evt, session) => {
      if (session?.user.id === utilisateur) return;
      utilisateur = session?.user.id;
      setTimeout(verifier);
    });
  </script>
</body>
</html>
